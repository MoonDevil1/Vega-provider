name: Validate Vega provider bundles

on:
  push:
    branches:
      - main
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all provider bundles
        run: npm run build
      - name: Verify required bundle outputs
        run: |
          test -s dist/multi/posts.js
          test -s dist/multi/meta.js
          test -s dist/multi/stream.js
          test -s dist/multi/episodes.js
          test -s dist/multi/catalog.js
          test -s dist/aniwatch/posts.js
          test -s dist/aniwatch/meta.js
          test -s dist/aniwatch/stream.js
          test -s dist/aniwatch/episodes.js
          test -s dist/aniwatch/catalog.js
