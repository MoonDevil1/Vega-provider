name: Build and publish provider bundles

on:
  push:
    branches:
      - main
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build provider bundles
        run: npm run build
      - name: Verify required bundle outputs
        run: |
          test -s dist/multi/posts.js
          test -s dist/multi/meta.js
          test -s dist/multi/stream.js
          test -s dist/multi/episodes.js
          test -s dist/multi/catalog.js
      - name: Commit generated bundles
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "Build provider bundles"
            git push
          else
            echo "Generated bundles are already up to date."
          fi
